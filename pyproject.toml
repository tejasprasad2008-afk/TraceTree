[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-analyzer"
version = "1.0.0"
description = "Cascading Behavioral Propagation Analyzer for Python Packages"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Security Researcher", email = "research@example.com"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.4.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "docker>=7.0.0",
    "google-cloud-storage>=2.10.0",
    "requests>=2.25.1",
    "skops>=0.12.0",
]

[project.scripts]
cascade-analyze = "cli:app"
cascade-train = "cli:train_cli"
cascade-watch = "cli:watch_app"
cascade-check = "cli:check_cli"
cascade-scan = "cli:scan_app"
cascade-install-hook = "cli:install_hook_cli"
cascade-uninstall-hook = "cli:uninstall_hook_cli"
cascade-dashboard = "cli:dashboard_cli"

[tool.setuptools]
packages = ["api", "sandbox", "monitor", "graph", "ml", "mcp", "mascot", "watcher", "hooks"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-v"]
markers = [
    "unit: unit tests",
    "integration: integration tests requiring external services",
]
